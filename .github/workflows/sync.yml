name: sync-latest-source

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-latest
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest from source site
        run: |
          python3 - <<'PY'
          import re, sys, pathlib, urllib.request, urllib.parse

          PAGE = "https://zrcdy.dpdns.org/lx/vers.php"
          BASE = "https://zrcdy.dpdns.org/lx/"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/157.0.0.0 Safari/537.36")
          NAME_RE = re.compile(r"^xinghai-music-sourcev(\d+(?:\.\d+)*)\.js$")
          OUT = pathlib.Path("xinghai-music-source.js")

          def get(url, binary=False):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
              return data if binary else data.decode("utf-8", "replace")

          html = get(PAGE)
          items, seen = [], set()
          for row in re.findall(r"<tr[^>]*>(.*?)</tr>", html, re.S | re.I):
              cells = re.findall(r"<td[^>]*>(.*?)</td>", row, re.S | re.I)
              if not cells:
                  continue
              name = re.sub(r"<[^>]+>", "", cells[0]).strip()
              m = NAME_RE.match(name)
              if not m or name in seen:
                  continue
              link = re.search(r'href="([^"]+)"', row, re.I)
              if not link:
                  continue
              seen.add(name)
              items.append((tuple(int(x) for x in m.group(1).split(".")),
                            name, urllib.parse.urljoin(BASE, link.group(1))))

          if not items:
              sys.exit("no items parsed")

          ver, name, url = max(items)
          ver_s = ".".join(str(x) for x in ver)
          data = get(url, binary=True).decode("utf-8", "replace")
          old = OUT.read_text(encoding="utf-8") if OUT.exists() else ""
          if old.strip() == data.strip():
              print(f"UP_TO_DATE v{ver_s} ({name})")
              sys.exit(0)
          OUT.write_text(data, encoding="utf-8")
          print(f"UPDATED v{ver_s} ({name}) {len(data)}B")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xinghai-music-source.js
          git commit -m "sync: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
